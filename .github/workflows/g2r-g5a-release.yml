name: G2R G5A Evidence Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2r-g5a-release
  cancel-in-progress: false

jobs:
  evidence:
    name: signed-96-cell-release
    runs-on: macos-14
    timeout-minutes: 720
    environment: g2r-release
    env:
      ORYN_APPLE_TEAM_ID: 5HVA9VFF8K
      ORYN_CODESIGN_IDENTITY: 9A1405B3288A8DD06DE0D29CCCD02B8B45A33F90
      AZURE_OPENAI_DEPLOYMENT: gpt-5.6-terra
      ORYN_QWEN3_DIGEST: 359d7dd4bcdab3d86b87d73ac27966f4dbb9f5efdfcc75d34a8764a09474fae7
      ORYN_OLLAMA_URL: http://127.0.0.1:11434
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require clean ARM64 source and pinned Rust
        run: |
          test "$(uname -m)" = arm64
          test -z "$(git status --porcelain)"
          rustup show active-toolchain | grep -F '1.98.0'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned Python environments
        run: |
          pipx install poetry==2.1.4
          cd oryn-python
          poetry install --no-interaction
          cd ../intentgym
          poetry install --no-interaction

      - name: Import protected development identity
        env:
          P12_BASE64: ${{ secrets.ORYN_APPLE_DEVELOPMENT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ORYN_APPLE_DEVELOPMENT_P12_PASSWORD }}
        run: |
          test -n "$P12_BASE64"
          test -n "$P12_PASSWORD"
          keychain="$RUNNER_TEMP/oryn-g2r.keychain-db"
          certificate="$RUNNER_TEMP/oryn-g2r.p12"
          password="$(openssl rand -hex 24)"
          printf '%s' "$P12_BASE64" | /usr/bin/base64 -D >"$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "ORYN_SIGNING_KEYCHAIN=$keychain" >>"$GITHUB_ENV"
          echo "ORYN_SIGNING_CERTIFICATE=$certificate" >>"$GITHUB_ENV"

      - name: Build and verify exact signed bundle
        run: ./scripts/build-sandboxed-worker.sh

      - name: Reject altered and invalid worker variants
        run: ./scripts/test-worker-rejections.sh

      - name: Fetch pinned untouched MiniWoB sources
        run: |
          mkdir -p artifacts/deps/miniwob-plusplus
          git -C artifacts/deps/miniwob-plusplus init
          git -C artifacts/deps/miniwob-plusplus remote add origin https://github.com/Farama-Foundation/miniwob-plusplus.git
          git -C artifacts/deps/miniwob-plusplus fetch --depth=1 origin 33c3b4ddef8c6eb67c57a29663d844b1eda7e614
          git -C artifacts/deps/miniwob-plusplus checkout --detach FETCH_HEAD
          test -z "$(git -C artifacts/deps/miniwob-plusplus status --porcelain)"

      - name: Start deterministic MiniWoB server
        run: |
          cd intentgym
          poetry run python scripts/serve_g2_miniwob.py \
            --checkout "$GITHUB_WORKSPACE/artifacts/deps/miniwob-plusplus" \
            >"$RUNNER_TEMP/oryn-miniwob.log" 2>&1 &
          echo "ORYN_MINIWOB_PID=$!" >>"$GITHUB_ENV"
          for _ in $(seq 1 100); do
            curl --fail --silent http://127.0.0.1:8765/.well-known/oryn-g2-fixture.json >/dev/null && exit 0
            sleep 0.1
          done
          exit 1

      - name: Start digest-pinned runner-local Ollama
        run: |
          brew install ollama
          ollama serve >"$RUNNER_TEMP/oryn-ollama.log" 2>&1 &
          echo "ORYN_OLLAMA_PID=$!" >>"$GITHUB_ENV"
          for _ in $(seq 1 120); do
            curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3:4b
          actual_digest="$(
            curl --fail --silent http://127.0.0.1:11434/api/tags |
              jq -r '.models[] | select(.name == "qwen3:4b" or .model == "qwen3:4b") | .digest' |
              head -n 1
          )"
          test "$actual_digest" = "$ORYN_QWEN3_DIGEST"

      - name: Run deterministic native and Chromium 24/24
        env:
          ORYN_PAGE_WORKER: ${{ github.workspace }}/target/release/OrynPageWorker.app/Contents/MacOS/oryn-page-worker
        run: |
          cd intentgym
          poetry run python scripts/run_g2_deterministic.py --domain both

      - name: Run churn, recovery, causal, and limit suites
        env:
          ORYN_PAGE_WORKER: ${{ github.workspace }}/target/release/OrynPageWorker.app/Contents/MacOS/oryn-page-worker
        run: |
          mkdir -p artifacts/g2r-g5a-v4
          cargo run --release --locked -p oryn-native --example g5a_worker_integration
          cargo run --release --locked -p oryn-native --example g2r_churn \
            >artifacts/g2r-g5a-v4/g2r-churn.json
          jq -e '
            .schema_version == 4 and
            .false_preservation.numerator == 0 and
            .recovery.value == 1 and
            .worker_replacement.status == "passed" and
            .status == "passed"
          ' artifacts/g2r-g5a-v4/g2r-churn.json >/dev/null

      - name: Run complete Azure/Qwen native/Chromium panel
        env:
          ORYN_PAGE_WORKER: ${{ github.workspace }}/target/release/OrynPageWorker.app/Contents/MacOS/oryn-page-worker
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        run: |
          test -n "$AZURE_OPENAI_API_KEY"
          test -n "$AZURE_OPENAI_ENDPOINT"
          test -n "$ORYN_OLLAMA_URL"
          cd intentgym
          poetry run python scripts/run_g2_model_panel.py \
            --ollama-url "$ORYN_OLLAMA_URL" \
            --prior-hosted-spend 5.209632

      - name: Recompute schema-v4 evidence and all repository gates
        run: |
          cd intentgym
          poetry run python scripts/validate_g2r_v4.py
          cd ..
          ./scripts/validate-benchmark-corpus.sh
          ./scripts/validate-g1-manifest.sh
          ./scripts/validate-g2-controlled.sh

      - name: Republish production measurements
        env:
          ORYN_PAGE_WORKER: ${{ github.workspace }}/target/release/OrynPageWorker.app/Contents/MacOS/oryn-page-worker
        run: ./scripts/benchmark-g5a-production.sh

      - name: Package content-addressed evidence without committing
        run: |
          source_hash="$(./scripts/source-tree-hash.sh)"
          package="artifacts/g2r-g5a-v4-${source_hash}.tar.gz"
          tar -C artifacts -czf "$package" g2r-g5a-v4
          shasum -a 256 "$package" >"$package.sha256"
          echo "ORYN_EVIDENCE_PACKAGE=$package" >>"$GITHUB_ENV"

      - name: Upload raw and compact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g2r-g5a-v4-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/g2r-g5a-v4
            ${{ env.ORYN_EVIDENCE_PACKAGE }}
            ${{ env.ORYN_EVIDENCE_PACKAGE }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup model server and signing material
        if: always()
        run: |
          if [[ -n "${ORYN_MINIWOB_PID:-}" ]]; then
            kill "$ORYN_MINIWOB_PID" || true
          fi
          if [[ -n "${ORYN_OLLAMA_PID:-}" ]]; then
            kill "$ORYN_OLLAMA_PID" || true
          fi
          if [[ -n "${ORYN_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$ORYN_SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${ORYN_SIGNING_CERTIFICATE:-}" ]]; then
            rm -f "$ORYN_SIGNING_CERTIFICATE"
          fi
