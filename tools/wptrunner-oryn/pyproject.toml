[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oryn-wptrunner"
version = "0.1.0"
requires-python = ">=3.10"
description = "Native Oryn product integration for pinned upstream wptrunner"

[project.entry-points."wptrunner.products"]
oryn = "oryn_wptrunner:load_product"

[tool.setuptools.packages.find]
include = ["oryn_wptrunner*"]
