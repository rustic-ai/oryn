[package]
name = "oryn-native-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oryn-native = { path = "../crates/oryn-native", features = ["in-process-probe"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
url = "2"

[[bin]]
name = "html_tree_sink"
path = "fuzz_targets/html_tree_sink.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dom_mutation"
path = "fuzz_targets/dom_mutation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "url_policy"
path = "fuzz_targets/url_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "worker_protocol"
path = "fuzz_targets/worker_protocol.rs"
test = false
doc = false
bench = false
