[package]
name = "oryn-net"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Asynchronous browser network primitives for Oryn"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zlib", "zstd"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
encoding_rs = "0.8"
url = "2"
