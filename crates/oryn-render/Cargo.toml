[package]
name = "oryn-render"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Optional CPU-first renderer for Oryn paint snapshots"

[dependencies]
oryn-render-core = { path = "../oryn-render-core" }
cssparser = "=0.37.0"
oryn-common = { path = "../oryn-common" }
oryn-layout = { path = "../oryn-layout" }
oryn-native = { path = "../oryn-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }
fontdue = "0.9"
skrifa = "0.44"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"
resvg = { version = "=0.45.1", default-features = false, features = ["text", "raster-images"] }
roxmltree = "=0.20.0"
url = "2"
base64 = "0.22"
svg2pdf = "=0.13.0"
pdf-writer = "=0.12.1"

[[bin]]
name = "oryn-render"
path = "src/main.rs"

[[example]]
name = "rendering_comparison"
path = "examples/rendering_comparison.rs"
