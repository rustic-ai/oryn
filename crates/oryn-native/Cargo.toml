[package]
name = "oryn-native"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Native browser runtime for Oryn"
build = "build.rs"

[features]
default = []
v8-host = ["dep:v8", "dep:oryn-layout", "oryn-js/v8-host"]
v8-sandbox = ["v8/v8_enable_sandbox", "oryn-js/v8-sandbox"]
in-process-probe = []
core-full = []
core-lite = []
semantic-oracle = []

[dependencies]
oryn-common = { path = "../oryn-common" }
oryn-core = { path = "../oryn-core" }
oryn-layout = { path = "../oryn-layout", optional = true }
oryn-dom = { path = "../oryn-dom" }
oryn-js = { path = "../oryn-js" }
oryn-net = { path = "../oryn-net" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
html5ever = "0.39"
markup5ever = "0.39"
url = "2"
futures-util = "0.3"
bytes = "1"
cookie = "0.18"
psl = "2"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
libc = "0.2"
redb = "4.2.0"
getrandom = "0.3"
regex = "1"
zeroize = "1"
flate2 = "1"
brotli = "8"
zstd = "0.13"
async-trait = "0.1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
v8 = { version = "150.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3.7"

[dev-dependencies]
h2 = "0.4"
http = "1"

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "oryn-host-probe"
path = "src/bin/host_probe.rs"
required-features = ["v8-host"]

[[bin]]
name = "oryn-page-worker"
path = "src/bin/page_worker.rs"
required-features = ["v8-host"]

[[bin]]
name = "oryn-native-probe"
path = "src/bin/native_probe.rs"
required-features = ["in-process-probe"]

[[bin]]
name = "oryn-startup-snapshot"
path = "src/bin/startup_snapshot.rs"
required-features = ["v8-host"]

[[example]]
name = "runtime_shadow"
required-features = ["in-process-probe"]

[[example]]
name = "semantic_causal_evidence"
required-features = ["in-process-probe"]

[[example]]
name = "conformance_focus_context_probe"
required-features = ["v8-host", "in-process-probe"]
