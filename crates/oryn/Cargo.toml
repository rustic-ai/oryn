[package]
name = "oryn"
version = "0.1.0"
edition = "2024"

[features]
default = ["native"]
native = []
native-v8 = ["oryn-native/v8-host"]
in-process-probe = ["oryn-native/in-process-probe"]
compat-core = ["dep:oryn-engine", "dep:oryn-domain"]
chromium = ["compat-core", "dep:oryn-h", "oryn-domain/chromium"]
embedded = ["compat-core", "dep:oryn-e"]
user-browser = ["compat-core", "dep:oryn-r", "oryn-domain/user-browser"]
compat-all = ["chromium", "embedded", "user-browser"]

[dependencies]
oryn-engine = { path = "../oryn-engine", optional = true }
oryn-domain = { path = "../oryn-domain", optional = true }
oryn-h = { path = "../oryn-h", optional = true }
oryn-e = { path = "../oryn-e", optional = true }
oryn-r = { path = "../oryn-r", optional = true }
oryn-native = { path = "../oryn-native" }

tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde_json = "1.0.149"
url = "2.5"
dirs = "4.0"
