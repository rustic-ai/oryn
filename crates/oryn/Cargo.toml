[package]
name = "oryn"
version = "0.1.0"
edition = "2024"

[features]
# Separate historical reproduction binary; never enable for qualification.
historical-test-input = ["oryn-native/historical-test-input"]
# The default/macOS parent is a privileged broker/client and remains V8-free.
# Linux production explicitly enables `native-v8` for its multicall ELF; V8 is
# initialized only after re-exec into the sandboxed worker role.
default = ["native", "core-full"]
native = []
webdriver-server = ["dep:axum", "dep:libc", "render"]
core-full = ["oryn-native/core-full"]
core-lite = ["oryn-native/core-lite"]
native-v8 = ["oryn-native/v8-host", "oryn-native/v8-sandbox"]
# Local conformance-only build: exercises the production V8/DOM algorithms
# without claiming the heap-sandbox attestation required by packaged binaries.
native-v8-probe = ["oryn-native/v8-host", "in-process-probe"]
render = ["dep:oryn-render"]
in-process-probe = ["oryn-native/in-process-probe"]
compat-core = ["dep:oryn-engine", "dep:oryn-domain"]
chromium = ["compat-core", "dep:oryn-h", "oryn-domain/chromium"]
embedded = ["compat-core", "dep:oryn-e"]
user-browser = ["compat-core", "dep:oryn-r", "oryn-domain/user-browser"]
compat-all = ["chromium", "embedded", "user-browser"]

[dependencies]
oryn-engine = { path = "../oryn-engine", optional = true }
oryn-domain = { path = "../oryn-domain", optional = true }
oryn-h = { path = "../oryn-h", optional = true }
oryn-e = { path = "../oryn-e", optional = true }
oryn-r = { path = "../oryn-r", optional = true }
oryn-native = { path = "../oryn-native" }
oryn-common = { path = "../oryn-common" }
oryn-render = { path = "../oryn-render", optional = true }

tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde_json = "1.0.149"
serde = { version = "1", features = ["derive"] }
url = "2.5"
dirs = "4.0"
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
axum = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }

[[example]]
name = "rendering_probe"
path = "examples/rendering_probe.rs"
required-features = ["render"]

[[bin]]
name = "oryn-mcp"
path = "src/bin/oryn_mcp.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "oryn-webdriver"
path = "src/bin/oryn_webdriver.rs"
required-features = ["webdriver-server"]
