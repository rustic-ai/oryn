[package]
name = "oryn-core"
version = "0.1.0"
edition = "2021"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
lazy_static = "1.4"
regex = "1.10"
strsim = "0.11.1"
oryn-common = { path = "../oryn-common" }
async-trait = "0.1"
async-recursion = "1.0"

[lib]
name = "oryn_core"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

# Binaryen bundled by wasm-pack does not yet accept the bulk-memory output
# produced by the pinned Rust 1.98 toolchain. The release artifact remains
# optimized by rustc; keep wasm-pack from failing after it has generated the
# valid extension module.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element"] }
console_error_panic_hook = "0.1"
serde_json = "1.0"
wasm-bindgen-futures = "0.4"
