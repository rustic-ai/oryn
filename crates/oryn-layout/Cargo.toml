[package]
name = "oryn-layout"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "V8-free shared selectors and text transforms with deterministic worker style and layout"

[dependencies]
base64 = "0.22"
usvg = { version = "=0.45.1", default-features = false, features = ["text"] }
roxmltree = "=0.20.0"
icu_properties = "=2.1.2"
icu_segmenter = "=2.1.2"
harfrust = "=0.12.0"
unicode-segmentation = "=1.12.0"
unicode-normalization = "=0.1.25"
oryn-dom = { path = "../oryn-dom" }
oryn-common = { path = "../oryn-common" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
url = "2"
sha2 = "0.10"
thiserror = "2"
taffy = { version = "0.14.0", default-features = false, features = ["std", "taffy_tree", "block_layout", "float_layout", "flexbox", "grid", "content_size", "detailed_layout_info", "parse"] }
parley = { version = "0.11.1", default-features = false, features = ["std", "libm"] }
skrifa = "0.44"
wuff = "0.2"
fontique = { version = "0.11.1", default-features = false, features = ["std"] }
style = { version = "=0.20.0", package = "stylo" }
style_traits = { version = "=0.20.0", package = "stylo_traits" }
style_atoms = { version = "=0.20.0", package = "stylo_atoms" }
style_dom = { version = "=0.20.0", package = "stylo_dom" }
selectors = "=0.40.0"
cssparser = "=0.37.0"
stylo_taffy = { git = "https://github.com/DioxusLabs/blitz", rev = "9d5cef2fa3d01423081681843d91b76ef593443e", default-features = false, features = ["std", "block", "flexbox", "grid", "floats"] }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "9d5cef2fa3d01423081681843d91b76ef593443e", default-features = false }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "9d5cef2fa3d01423081681843d91b76ef593443e" }

[dev-dependencies]
resvg = { version = "=0.45.1", default-features = false, features = ["text"] }
