[package]
name = "oryn-webidl"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Narrow, testable WebIDL compiler for Oryn browser bindings"

[dependencies]
prettyplease = "0.2"
syn = { version = "2", features = ["full"] }
thiserror = "2"

[[bin]]
name = "oryn-webidl"
path = "src/main.rs"
