[workspace]
resolver = "2"
exclude = ["fuzz", "vendor/stylo", "vendor/blitz-dom"]
members = [
    "crates/oryn-common",
    "crates/oryn-core",
    "crates/oryn-engine",
    "crates/oryn-scanner",
    "crates/oryn-e",
    "crates/oryn-h",
    "crates/oryn-r",
    "crates/oryn",
    "crates/oryn-native",
    "crates/oryn-dom",
    "crates/oryn-js",
    "crates/oryn-net",
    "crates/oryn-layout",
    "crates/oryn-render",
    "crates/oryn-webidl",
    "crates/oryn-domain",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep Oryn's DOM queries and Blitz stylesheet traversal on the same Stylo patch.
[patch.crates-io]
stylo = { path = "vendor/stylo" }

# Preserve namespace-dependent selector semantics in the Stylo mirror adapter.
[patch."https://github.com/DioxusLabs/blitz"]
blitz-dom = { path = "vendor/blitz-dom" }
