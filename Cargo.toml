[workspace]
resolver = "2"
exclude = ["fuzz", "vendor/stylo", "vendor/stylo_atoms", "vendor/blitz-dom", "vendor/stylo_taffy", "vendor/xml", "vendor/usvg", "vendor/resvg", "vendor/html5ever", "vendor/markup5ever", "vendor/reqwest", "vendor/chardetng", "vendor/rusty-v8"]
members = [
    "crates/oryn-common",
    "crates/oryn-core",
    "crates/oryn-engine",
    "crates/oryn-scanner",
    "crates/oryn-e",
    "crates/oryn-h",
    "crates/oryn-r",
    "crates/oryn",
    "crates/oryn-native",
    "crates/oryn-dom",
    "crates/oryn-js",
    "crates/oryn-net",
    "crates/oryn-layout",
    "crates/oryn-render",
    "crates/oryn-render-core",
    "crates/oryn-webidl",
    "crates/oryn-domain",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Native parser and style adapters share the pinned vendored patches.
[patch.crates-io]
v8 = { path = "vendor/rusty-v8" }
reqwest = { path = "vendor/reqwest" }
html5ever = { path = "vendor/html5ever" }
markup5ever = { path = "vendor/markup5ever" }
parley = { path = "vendor/parley" }
harfrust = { path = "vendor/harfrust" }
xml = { path = "vendor/xml" }
stylo = { path = "vendor/stylo" }
stylo_atoms = { path = "vendor/stylo_atoms" }
usvg = { path = "vendor/usvg" }
resvg = { path = "vendor/resvg" }

# Preserve namespace-dependent selector semantics in the Stylo mirror adapter.
[patch."https://github.com/DioxusLabs/blitz"]
blitz-dom = { path = "vendor/blitz-dom" }
stylo_taffy = { path = "vendor/stylo_taffy" }
